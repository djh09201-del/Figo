<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money Transfer Demo</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f3f6f8;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.app{
  width:100%;
  max-width:390px;
  min-height:100vh;
  background:white;
  padding:25px 20px;
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

h2{
  text-align:center;
  margin-top:25px;
}

input, textarea{
  width:100%;
  padding:15px;
  margin:10px 0;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:10px;
  background:#1687d9;
  color:white;
  font-size:17px;
  margin-top:10px;
}

.amount{
  font-size:28px;
  font-weight:bold;
  text-align:center;
  margin:25px 0;
}

.error{
  color:#d00;
  text-align:center;
  margin:10px 0;
}

.confirm-box{
  background:#f5f5f5;
  padding:18px;
  border-radius:12px;
  margin-top:20px;
}

.success{
  text-align:center;
  padding-top:80px;
}

.check{
  font-size:65px;
}
</style>
</head>

<body>

<div class="app">

<!-- STEP 1 -->
<div class="screen active" id="step1">
  <h2>Enter PIN</h2>

  <input
    type="password"
    id="pin"
    maxlength="4"
    placeholder="Enter 4-digit PIN"
    inputmode="numeric">

  <button onclick="step1Next()">Continue</button>
</div>


<!-- STEP 2 -->
<div class="screen" id="step2">
  <h2>Send Money</h2>

  <div class="amount">
    Send Money
  </div>

  <input
    type="number"
    id="amount"
    placeholder="Enter amount">

  <button onclick="step2Next()">Continue</button>
</div>


<!-- STEP 3 -->
<div class="screen" id="step3">
  <h2>Recipient</h2>

  <input
    type="tel"
    id="phone"
    placeholder="Recipient phone number">

  <button onclick="step3Next()">Continue</button>
</div>


<!-- STEP 4 -->
<div class="screen" id="step4">
  <h2>Comment</h2>

  <textarea
    id="comment"
    rows="4"
    placeholder="Write a comment"></textarea>

  <button onclick="step4Next()">Continue</button>
</div>


<!-- STEP 5 -->
<div class="screen" id="step5">

  <h2>Check Balance</h2>

  <div class="confirm-box">
    <p>Available balance:</p>
    <h2 id="balance">10,000 Birr</h2>

    <p>Amount:</p>
    <h3 id="showAmount"></h3>
  </div>

  <p class="error" id="balanceError"></p>

  <button onclick="step5Next()">Continue</button>
</div>


<!-- STEP 6 -->
<div class="screen" id="step6">

  <h2>Recipient Name</h2>

  <div class="confirm-box">

    <p>Recipient number</p>
    <h3 id="showPhone"></h3>

    <p>Recipient name</p>
    <h3 id="recipientName">Demo Recipient</h3>

  </div>

  <button onclick="step6Next()">Continue</button>
</div>


<!-- STEP 7 -->
<div class="screen" id="step7">

  <h2>Confirm Transfer</h2>

  <div class="confirm-box">

    <p>Recipient:</p>
    <h3 id="confirmName"></h3>

    <p>Number:</p>
    <h3 id="confirmPhone"></h3>

    <p>Amount:</p>
    <h3 id="confirmAmount"></h3>

    <p>Comment:</p>
    <h3 id="confirmComment"></h3>

  </div>

  <button onclick="step7Next()">✓ Confirm</button>
</div>


<!-- STEP 8 -->
<div class="screen" id="step8">

  <div class="success">

    <div class="check">✓</div>

    <h2>Done</h2>

    <p>Money transfer completed successfully.</p>

    <h3 id="sentAmount"></h3>

    <button onclick="restart()">Start Again</button>

  </div>

</div>

</div>


<script>

let amount = 0;
let phone = "";
let comment = "";

const balance = 10000;


/* SHOW STEP */

function showStep(number){

  document.querySelectorAll(".screen")
    .forEach(screen => {
      screen.classList.remove("active");
    });

  document
    .getElementById("step" + number)
    .classList.add("active");

}


/* STEP 1 */

function step1Next(){

  const pin = document.getElementById("pin").value;

  if(pin.length !== 4){
    alert("Please enter a 4-digit PIN.");
    return;
  }

  showStep(2);
}


/* STEP 2 */

function step2Next(){

  amount = Number(
    document.getElementById("amount").value
  );

  if(!amount || amount <= 0){
    alert("Please enter a valid amount.");
    return;
  }

  document.getElementById("showAmount")
    .innerText = amount.toLocaleString() + " Birr";

  showStep(3);
}


/* STEP 3 */

function step3Next(){

  phone =
    document.getElementById("phone").value.trim();

  if(phone.length < 5){
    alert("Please enter a valid phone number.");
    return;
  }

  document.getElementById("showPhone")
    .innerText = phone;

  showStep(4);
}


/* STEP 4 */

function step4Next(){

  comment =
    document.getElementById("comment").value.trim();

  showStep(5);

  if(amount > balance){

    document.getElementById("balanceError")
      .innerText =
      "Insufficient balance.";

  }else{

    document.getElementById("balanceError")
      .innerText = "";

  }
}


/* STEP 5 */

function step5Next(){

  if(amount > balance){

    alert("Insufficient balance.");
    return;

  }

  showStep(6);
}


/* STEP 6 */

function step6Next(){

  document.getElementById("confirmName")
    .innerText = "Demo Recipient";

  document.getElementById("confirmPhone")
    .innerText = phone;

  document.getElementById("confirmAmount")
    .innerText =
    amount.toLocaleString() + " Birr";

  document.getElementById("confirmComment")
    .innerText =
    comment || "No comment";

  showStep(7);
}


/* STEP 7 */

function step7Next(){

  document.getElementById("sentAmount")
    .innerText =
    amount.toLocaleString() + " Birr Sent";

  showStep(8);
}


/* RESTART / REFRESH */

function restart(){

  location.reload();

}

</script>

</body>
</html>
